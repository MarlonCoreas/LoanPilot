name: Verify LoanPilot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test the site
        run: npm test

      - name: Type-check source
        run: npm run typecheck

      - name: Upload static website artifact
        uses: actions/upload-artifact@v7
        with:
          name: loanpilot-site
          path: dist
