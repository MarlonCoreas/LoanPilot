<!doctype html>
<!--
  Fuente de la tarjeta social (public/og.png). Regenerar con:
    npm run og
  Cualquier cambio aquí exige volver a ejecutar ese comando: el PNG es el que
  se publica, este archivo sólo lo produce.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #102a2a;
        background-image: radial-gradient(#1d3d3b 1.5px, transparent 1.5px);
        background-size: 30px 30px;
        font-family: Helvetica, Arial, sans-serif;
        color: #fffefb;
        padding: 72px 76px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        width: 720px; height: 720px;
        right: -260px; top: -300px;
        background: radial-gradient(circle, rgba(169,244,207,.13), transparent 65%);
      }
      .top { display: flex; align-items: center; gap: 16px; position: relative; }
      .mark {
        width: 54px; height: 54px; border-radius: 50%;
        background: #a9f4cf; color: #102a2a;
        display: grid; place-items: center;
        font-size: 20px; font-weight: 800; letter-spacing: -1px;
      }
      .word { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
      .badge {
        margin-left: auto;
        display: flex; align-items: center; gap: 11px;
        border: 1px solid #36504d; border-radius: 999px;
        padding: 10px 18px;
        font-size: 13px; font-weight: 800; letter-spacing: 2px;
        color: #a8bab5;
      }
      .flag {
        width: 22px; height: 14px; border-radius: 2px;
        background: linear-gradient(#0f66bd 0 33%, #fff 33% 66%, #0f66bd 66%);
      }
      h1 {
        font-size: 82px; line-height: .97; letter-spacing: -3.5px;
        font-weight: 800; position: relative;
      }
      h1 em { font-style: normal; color: #a9f4cf; }
      .sub {
        margin-top: 26px; max-width: 760px;
        font-size: 25px; line-height: 1.45; color: #a8bab5;
      }
      .foot {
        display: flex; align-items: center; justify-content: space-between;
        border-top: 1px solid #2c4644; padding-top: 26px;
        position: relative;
      }
      .domain { font-size: 22px; font-weight: 700; color: #a9f4cf; }
      .tags { display: flex; gap: 30px; font-size: 17px; color: #8fa5a0; }
      .tags span::before { content: "✓"; color: #a9f4cf; margin-right: 9px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <div class="top">
      <div class="mark">LP</div>
      <div class="word">LoanPilot</div>
      <div class="badge"><i class="flag"></i>EL SALVADOR</div>
    </div>

    <div>
      <h1>Entiende tu préstamo.<br /><em>Decide con claridad.</em></h1>
      <p class="sub">
        Calcula la cuota, el costo efectivo real y cuánto ahorras haciendo
        abonos a capital.
      </p>
    </div>

    <div class="foot">
      <div class="domain">loanpilot.marloncoreas.com</div>
      <div class="tags">
        <span>Gratis</span>
        <span>Sin registro</span>
        <span>Tus datos no salen del navegador</span>
      </div>
    </div>
  </body>
</html>
